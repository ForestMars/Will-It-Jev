[project]
name = "jev-calibration"
version = "0.1.0"
description = "Calibration and task-head training utilities for Will-It-Jev"
requires-python = ">=3.12"
dependencies = [
    "numpy>=1.26",
    "onnxruntime>=1.17",
    "scikit-learn>=1.4",
    "scipy>=1.12",
    "tokenizers>=0.15",
]

[dependency-groups]
dev = ["pytest>=8"]
