# Task contracts, available tiers, task-specific cascades and resolution policies
# are separate concerns. Each task's cascade is an ordered TierId path. The
# union of all paths forms a DAG; shared TierIds execute once for all eligible
# tasks that reach the node.

[pipeline]
tag_via_cascade = false
tag_in_request = false
tag_budget_ms = 4000

[task.route]
labels = ["jev_capable", "needs_llm"]
fallback_label = "needs_llm"
cascade = ["rules", "fasttext", "modernbert", "harrier"]

[task.tag]
output_kind = "multiclass"
taxonomy = "../taskonomies/help_desk.json"
fallback = "defer"
cascade = ["modernbert", "harrier"]

# The registry catalogs available TierIds. It does not define execution order.
# executor selects the computation; transport describes how the router reaches
# it; request_shape selects the scorer RPC contract.

[[tier]]
name = "rules"
executor = "rules"
transport = "in_process"
legacy_ordinal = 1

[[tier]]
name = "fasttext"
executor = "fasttext"
transport = "in_process"
legacy_ordinal = 2

[[tier]]
name = "modernbert"
executor = "scorer"
transport = "grpc"
request_shape = "score"
legacy_ordinal = 3

[[tier]]
name = "harrier"
executor = "scorer"
transport = "grpc"
request_shape = "score"
legacy_ordinal = 4

# Calibration belongs to a TierId + TaskId pair.
[tier_policy.rules.route]
min_confidence = 0.78
strict = true
never_resolve = ["needs_llm"]

[tier_policy.fasttext.route]
min_confidence = 0.95
never_resolve = ["needs_llm"]

[tier_policy.modernbert.route]
min_confidence = 0.95
label_min_confidence = { jev_capable = 0.95, needs_llm = 0.70 }

[tier_policy.harrier.route]
min_confidence = 0.95
label_min_confidence = { jev_capable = 0.95, needs_llm = 0.70 }

# To evaluate route and tag heads in one ScoreTasks call, change the relevant
# tier's request_shape to "score_tasks" and add its tag policy:
# [tier_policy.modernbert.tag]
# min_confidence = 0.85
