# Task contracts, tier definitions, configured instances and policies are
# separate. Each [[tier]] entry is one configured instance; array order is run
# order. Multiple instances may reference the same tier definition.

[pipeline]
tag_via_cascade = false
tag_in_request = false
tag_budget_ms = 4000
joint_tiers = []

[task.route]
labels = ["jev_capable", "needs_llm"]
fallback_label = "needs_llm"

[task.tag]
output_kind = "multiclass"
taxonomy = "../taskonomies/help_desk.json"
fallback = "defer"

# ---- Configured tier instances ---------------------------------------------
# name: stable instance identity, used by policies and telemetry
# tier: reusable execution definition (rules | fasttext | grpc)
# model_id: selected model artifact/configuration for this instance
#
# The two gRPC instances below share the same execution definition while
# selecting different model configurations and endpoints.

[[tier]]
name = "rules"
tier = "rules"
enabled = true

[[tier]]
name = "fasttext"
tier = "fasttext"
model_id = "fasttext-default"
enabled = true

[[tier]]
name = "modernbert"
tier = "grpc"
model_id = "modernbert"
enabled = true
endpoint = "http://[::1]:50052"
timeout_ms = 500

[[tier]]
name = "harrier"
tier = "grpc"
model_id = "harrier"
enabled = true
endpoint = "http://[::1]:50051"
timeout_ms = 500

# Calibration is instance-scoped. The two grpc instances can diverge without
# changing their shared execution definition.

[tier_policy.rules.route]
min_confidence = 0.78
strict = true
never_resolve = ["needs_llm"]

[tier_policy.fasttext.route]
min_confidence = 0.95
never_resolve = ["needs_llm"]

[tier_policy.modernbert.route]
min_confidence = 0.95
label_min_confidence = { jev_capable = 0.95, needs_llm = 0.70 }

[tier_policy.harrier.route]
min_confidence = 0.95
label_min_confidence = { jev_capable = 0.95, needs_llm = 0.70 }

# To enable a joint tag task on one encoder instance, set joint = true on that
# instance and add [tier_policy.<instance>.tag].
#
# [tier_policy.modernbert.tag]
# min_confidence = 0.85
