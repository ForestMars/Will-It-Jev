# Each task owns an ordered cascade of TierNames. CascadeGraph materializes
# the referenced TierInstances and compiles shared task paths into a DAG.

[pipeline]
tag_via_cascade = false
tag_in_request = false
tag_budget_ms = 4000

[task.route]
cascade = ["rules", "fasttext", "modernbert", "harrier"]
labels = ["jev_capable", "needs_llm"]
fallback_label = "needs_llm"

[task.tag]
cascade = ["modernbert", "harrier"]
output_kind = "multiclass"
taxonomy = "../taskonomies/help_desk.json"
fallback = "defer"

# Each [[tier]] is an available Tier definition, addressed by TierName. The
# registry catalogs definitions; task cascades select which definitions the
# CascadeGraph materializes as TierInstances with hash-derived TierIds.
#
#   executor     which executor handles the tier: rules | fasttext | encoder
#   transport    how the router reaches it: in_process | grpc
#   request_shape  encoder only: the RPC contract, score | score_tasks
#   model_format  encoder inference runtime: onnx | gguf; selects the adapter
#   model        fasttext: model file; encoder: opaque instance configuration
#                included in the hash-derived TierId
#   config       rules: rule file
#
# `model` / `config` fall back to FASTTEXT_MODEL / TIER1_CONFIG for a definition
# that declares none. `scorer` is accepted as an alias of `encoder`.

[[tier]]
name = "rules"
executor = "rules"
transport = "in_process"

[[tier]]
name = "fasttext"
executor = "fasttext"
transport = "in_process"

[[tier]]
name = "modernbert"
executor = "encoder"
model_format = "onnx"
transport = "grpc"
request_shape = "score"

[[tier]]
name = "harrier"
executor = "encoder"
model_format = "gguf"
transport = "grpc"
request_shape = "score"

# Compatibility only. Before tiers had names the original four were numbered;
# the numbered telemetry fields (tier1_outcome .. tier4_outcome,
# cascade_decision_tier, resolving_tier), the [router.tierN] settings in
# router.toml, the numbered environment variables and `tierN` aliases in
# [tier_policy.*] keys still use those numbers. This table is the only place a
# name and a number meet; no tier, instance or cascade type carries it.
[legacy_tiers]
rules = 1
fasttext = 2
modernbert = 3
harrier = 4

# Calibration belongs to a tier name + task pair. A policy may record the
# instance it was fitted on with `calibrated_for = "<TierId, 32 hex>"`; the
# startup compares it with the TierInstance materialized on the graph.
# `authority = "observe"` records a tier's reading for a task without ever
# resolving it, for heads that are logged rather than routed.
[tier_policy.rules.route]
min_confidence = 0.78
strict = true
never_resolve = ["needs_llm"]

[tier_policy.fasttext.route]
min_confidence = 0.95
never_resolve = ["needs_llm"]

[tier_policy.modernbert.route]
min_confidence = 0.95
label_min_confidence = { jev_capable = 0.95, needs_llm = 0.70 }

[tier_policy.harrier.route]
min_confidence = 0.95
label_min_confidence = { jev_capable = 0.95, needs_llm = 0.70 }

# To evaluate route and tag heads in one ScoreTasks call, change the relevant
# tier's request_shape to "score_tasks" and add its tag policy:
# [tier_policy.modernbert.tag]
# min_confidence = 0.85
