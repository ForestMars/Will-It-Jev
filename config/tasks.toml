# Task contracts, reusable tier definitions, configured instances, then policies.
# The tier_instance array is the cascade order. Definitions are reusable and
# may be shared by any number of instances. Environment overrides are named
# TIER_<INSTANCE>_ENDPOINT and TIER_<INSTANCE>_MAX_CALL_MS.

[pipeline]
tag_via_cascade = false
tag_in_request = false
tag_budget_ms = 4000
joint_tiers = []

[task.route]
output_kind = "binary"
labels = ["jev_capable", "needs_llm"]
fallback_label = "needs_llm"

[task.tag]
output_kind = "multiclass"
taxonomy = "../taskonomies/help_desk.json"
fallback = "defer"

[[tier_definition]]
name = "rules"
kind = "rules"

[[tier_definition]]
name = "fasttext"
kind = "fasttext"

[[tier_definition]]
name = "encoder"
kind = "grpc"

[[tier_instance]]
name = "rules"
tier = "rules"
model_id = "rules-v1"

[[tier_instance]]
name = "fasttext"
tier = "fasttext"
model_id = "fasttext-default"

[[tier_instance]]
name = "modernbert"
tier = "encoder"
model_id = "modernbert-base"
endpoint = "http://[::1]:50052"
timeout_ms = 500

[[tier_instance]]
name = "harrier"
tier = "encoder"
model_id = "harrier-270m"
endpoint = "http://[::1]:50051"
timeout_ms = 500

[tier_policy.rules.route]
min_confidence = 0.78
strict = true
never_resolve = ["needs_llm"]

[tier_policy.fasttext.route]
min_confidence = 0.95
never_resolve = ["needs_llm"]

[tier_policy.modernbert.route]
min_confidence = 0.95
label_min_confidence = { jev_capable = 0.95, needs_llm = 0.70 }

[tier_policy.harrier.route]
min_confidence = 0.95
label_min_confidence = { jev_capable = 0.95, needs_llm = 0.70 }

# Add an instance-scoped tag policy and set joint = true on that encoder
# instance (or list its instance name in pipeline.joint_tiers) to enable
# one-encoder, multi-task scoring for sampled route+tag requests.
