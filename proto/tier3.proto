syntax = "proto3";
package tier3;

service Tier3Scorer {
  rpc Score (ScoreRequest) returns (ScoreResponse);
  // Joint execution: one shared encoding of `prompt`, one head per requested
  // task. Additive; sidecars that predate it answer UNIMPLEMENTED and the
  // router falls back to Score for the route task.
  rpc ScoreTasks (ScoreTasksRequest) returns (ScoreTasksResponse);
}

message ScoreRequest {
  string prompt = 1;
  // Configured model selection for this tier instance. Empty leaves selection
  // to the sidecar's deployment default.
  string model_id = 2;
}

message ScoreResponse {
  float raw_score = 1;
  float confidence = 2;
  string label = 3;
  string model_id = 4;
}

message TaskLabel {
  string id = 1;
  string name = 2;
  string description = 3;
  string classifier_criterion = 4;
  string group_id = 5;
}

message TaskSpec {
  string task = 1;
  OutputKind output_kind = 2;
  repeated TaskLabel labels = 3;
  string taxonomy_version = 4;
}

message ScoreTasksRequest {
  string prompt = 1;
  // Retained for compatibility with clients that send only task identifiers.
  repeated string tasks = 2;
  // Typed task contracts from the Rust cascade. Sidecars validate their local
  // heads against these labels and output shapes before returning readings.
  repeated TaskSpec task_specs = 3;
  // Configured model selection for this tier instance. Empty leaves selection
  // to the sidecar's deployment default.
  string model_id = 4;
}

message LabelScore {
  string label = 1;
  float score = 2;
}

enum OutputKind {
  OUTPUT_KIND_UNSPECIFIED = 0;
  BINARY = 1;
  MULTICLASS = 2;
  MULTILABEL = 3;
  ORDINAL = 4;
}

message TaskScore {
  string task = 1;
  string label = 2;        // top label for single-label heads; representative label for multilabel
  float confidence = 3;    // calibrated confidence of the selected label
  repeated LabelScore scores = 4;  // class distribution or independent multilabel probabilities
  OutputKind output_kind = 5;
}

message ScoreTasksResponse {
  string model_id = 1;
  repeated TaskScore results = 2;
  repeated string unsupported = 3;
}
